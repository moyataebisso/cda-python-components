# Mosquitto Configuration for Lab Module 10
# PIOT-CFG-10-001: TLS Configuration for MQTT Broker

# Standard MQTT listener (non-encrypted)
listener 1883
protocol mqtt

# Secure MQTT listener (TLS/SSL)
listener 8883
protocol mqtt

# TLS/SSL Configuration
cafile /home/ebiss/piot/cda-python-components/config/cert/ca.crt
certfile /home/ebiss/piot/cda-python-components/config/cert/server.crt
keyfile /home/ebiss/piot/cda-python-components/config/cert/server.key

# Don't require client certificates for initial testing
require_certificate false
use_identity_as_username false

# Use TLS v1.2 or higher
tls_version tlsv1.2

# Allow anonymous connections for testing
allow_anonymous true

# Logging
log_type all
log_dest stdout

# Persistence
persistence true
persistence_location /tmp/mosquitto/

# QoS settings - support all levels for testing
max_qos 2
